# Lab 13 · CP4 · Kế hoạch pilot LogiX-VN · Nhóm 3chan
# Nguồn số: src/lab13.py (chạy trong src/: python lab13.py)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; 1.251 × 2,48 = 3.103 yêu cầu = 42 nhân viên mỗi nhóm; tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300, chỉ 6 cụm < 20: loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m ≥ 299 yêu cầu mỗi nhân viên (DE 6,96), tức 5.980 yêu cầu thực mỗi nhóm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng xử lý cùng loại yêu cầu trong cùng thời gian, cân bằng theo depot.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed 13 ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ gợi ý trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 0,06, cỡ mẫu, luật dừng và ngày quyết định chốt trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 20 cụm chỉ đủ thấy mức chênh 6 điểm, không đủ cho 5 điểm (tối đa 1.000 < 1.251);
#   nếu tác động thật là 5 điểm thì power chỉ còn khoảng 0,64 (64,18%).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% (51/1.200) toàn mẫu, 3,97% (39/982)
#   trong phạm vi noi_dia + hang_nang. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên chọn: nhóm trợ lý
#   cao hơn đối chứng ≥ 2 điểm hoặc vượt trần tuyệt đối 6%.
#
# D2 · Năm câu kiểm tra tách được tác động, theo phương án đã ghi trong kế hoạch:
# D2.1. Đối chứng cùng thời gian: Có theo thiết kế; hai nhánh xử lý cùng loại yêu cầu tại các depot có cả hai nhánh, trong cùng giai đoạn đo chính từ tuần 3.
# D2.2. Ngẫu nhiên hay người chọn: Theo kế hoạch, chia ngẫu nhiên 40 nhân viên thành 20/20, cân bằng theo depot với seed 13 và giữ nguyên nhánh suốt pilot.
# D2.3. Ảnh hưởng gián tiếp: Có nguy cơ chia sẻ gợi ý; giảm bằng cấp quyền theo tài khoản, không chia sẻ giữa nhánh và kiểm tra log sử dụng.
# D2.4. Viết trước: Kế hoạch quy định chốt chỉ số, MDE, cỡ mẫu, ngưỡng dừng và lịch trước khi bắt đầu; ngày quyết định 2027-01-05 hiện là dự kiến, cần nhóm xác nhận.
# D2.5. Ít nhất 20 cụm mỗi nhánh: Có theo thiết kế; mỗi nhánh 20 cụm nhân viên, mỗi người tối thiểu 299 yêu cầu; MDE 6 điểm, power khoảng 64,18% nếu tác động thật chỉ 5 điểm.

